<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Candidate Evaluation Form – QR Code</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #f0f4f8;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(74,108,247,0.12);
            padding: 3rem 3.5rem;
            text-align: center;
            max-width: 480px;
            width: 100%;
        }

        .brand {
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 0.15em;
            color: #4a6cf7;
            text-transform: uppercase;
            margin-bottom: 0.4rem;
        }

        h1 {
            font-size: 1.35rem;
            font-weight: 700;
            color: #1a202c;
            margin-bottom: 0.5rem;
            line-height: 1.3;
        }

        .subtitle {
            font-size: 0.875rem;
            color: #718096;
            margin-bottom: 2rem;
        }

        .qr-wrapper {
            display: inline-block;
            padding: 1rem;
            border: 2px solid #e8eeff;
            border-radius: 12px;
            background: #fff;
            margin-bottom: 1.75rem;
        }

        .qr-wrapper img {
            display: block;
            width: 260px;
            height: 260px;
        }

        .url-box {
            background: #f7f8fc;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 0.65rem 1rem;
            font-size: 0.78rem;
            color: #4a6cf7;
            word-break: break-all;
            margin-bottom: 1.75rem;
            font-family: monospace;
        }

        .instructions {
            font-size: 0.82rem;
            color: #718096;
            line-height: 1.6;
        }

        .instructions strong {
            color: #374151;
        }

        .divider {
            border: none;
            border-top: 1px solid #e2e8f0;
            margin: 1.5rem 0;
        }

        @media print {
            body { background: #fff; }
            .card { box-shadow: none; border: 1px solid #ddd; }
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="brand">Spacestem</div>
        <h1>Candidate Information &amp;<br>Evaluation Form</h1>
        <p class="subtitle">Scan the QR code below to fill the form</p>

        <div class="qr-wrapper">
            <img
                src="https://api.qrserver.com/v1/create-qr-code/?size=260x260&ecc=H&data=https%3A%2F%2Frecruitmentportal.order-line.co.uk%2FCandidateEvaluationForms%2FCreate"
                alt="QR Code for Candidate Evaluation Form"
            />
        </div>

        <div class="url-box">https://recruitmentportal.order-line.co.uk/CandidateEvaluationForms/Create</div>

        <hr class="divider" />

        <p class="instructions">
            <strong>How to use:</strong><br>
            Open your phone camera and point it at the QR code.<br>
            Tap the link that appears to open the form.
        </p>
    </div>
</body>
</html>
